version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        - hugeParam
        - uncheckedInlineErr # misreads positions in cgo files
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          disabled: true # internal packages
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
          disabled: true # interface implementations and cgo exports
        - name: var-naming
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: [std-error-handling]
    rules:
      # tests may ignore errors of setup steps they assert on otherwise
      - path: _test\.go
        linters: [errcheck, bodyclose]

formatters:
  enable: [gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/mirzomumin/balius]
